name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '16 19 * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: perl:latest

    permissions:
      id-token: write
      pages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: apt -qqq update

      - run: apt -qqq install nodejs zip gh

      - run: cpanm -qn Data::Mirror LWP::Protocol::https Image::Size Lingua::EN::Titlecase Template::Liquid File::Copy::Recursive

      - run: cp -Rvp images _site

      - run: ./bfgdata.pl

      - run: zip -r archive.zip _site

      - run: mv archive.zip _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5

      - uses: actions/deploy-pages@v5
